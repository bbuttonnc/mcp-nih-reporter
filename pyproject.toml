[project]
name = "mcp-nih-reporter"
version = "0.1.0"
description = "MCP server for querying NIH RePORTER API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.4.1",
]

[tool.setuptools.packages.find]
include = ["mcp_nih_reporter*"]

[project.scripts]
mcp-nih-reporter = "mcp_nih_reporter:main"
